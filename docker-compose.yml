version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Server Instance 1
  server1:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chat_db?schema=public&sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key
      - PORT=3000
      - CORS_ORIGIN=https://kearl.me,https://www.kearl.me
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    # volumes:
    #   - ./src:/app/src

  # Server Instance 2
  server2:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chat_db?schema=public&sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key
      - PORT=3000
      - CORS_ORIGIN=https://kearl.me,https://www.kearl.me
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    # volumes:
    #   - ./src:/app/src

  # Nginx Load Balancer
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - server1
      - server2

volumes:
  postgres_data:
  redis_data:
